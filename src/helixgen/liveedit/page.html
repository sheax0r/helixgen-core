<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix Live</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d12; --panel:#161a22; --panel2:#1c212b; --edge:#2a3140; --edge2:#3a4356;
  --ink:#eef1f7; --dim:#8a93a8; --faint:#5b6478;
  --wire:#3d6bff; --wire-glow:rgba(61,107,255,.45);
  --up:#35d08a; --up-glow:rgba(53,208,138,.5); --down:#ff7ac2; --down-glow:rgba(255,122,194,.5);
  --ok:#35d08a; --warn:#ffb020; --bad:#ff5d5d;
  --gap:22px; --wireh:34px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -200px,#18203a 0,var(--bg) 60%) fixed,var(--bg);
  color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:80px}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:10px 20px;background:rgba(11,13,18,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
.led{width:11px;height:11px;border-radius:50%;background:var(--ok);flex:none;
  box-shadow:0 0 0 3px rgba(53,208,138,.16),0 0 12px var(--ok)}
body.down .led{background:var(--bad);box-shadow:0 0 0 3px rgba(255,93,93,.18),0 0 12px var(--bad);
  animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.who{flex:1 1 240px;min-width:0;display:flex;flex-direction:column}
.preset{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.sub{display:none} .top{gap:9px;padding:10px 12px} .btn{padding:6px 9px}}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;border:1px solid var(--edge2);color:var(--dim);white-space:nowrap}
.chip.snap{color:#cfe0ff;border-color:#34508f;background:#14203d}
.chip.dirty{color:#1b1400;background:var(--warn);border-color:var(--warn);display:none}
body.dirty .chip.dirty{display:inline-block}
.grow{flex:1}
.btn{background:var(--panel2);border:1px solid var(--edge2);border-radius:9px;padding:6px 12px;
  cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#5a6680}
.btn:disabled{opacity:.35;cursor:default}
.btn.save{font-weight:700}
body.dirty .btn.save{background:var(--warn);border-color:var(--warn);color:#1b1400}
.banner{display:none;margin:0;padding:9px 20px;background:#3a1418;color:#ffd0d0;
  border-bottom:1px solid #6b2229;font-weight:600}
body.down .banner{display:block}

/* ---------- snapshot bar + preset picker ---------- */
.snaprow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 20px;
  border-bottom:1px solid var(--edge);background:rgba(16,22,38,.5)}
.snaprow:empty{display:none}
.snaprow .cap{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.snap-btn{background:#14203d;border:1px solid #34508f;color:#cfe0ff;border-radius:999px;
  padding:5px 12px;cursor:pointer;font-size:12px;white-space:nowrap}
.snap-btn:hover{border-color:#5f84d6}
.snap-btn.on{background:#2c66d6;border-color:#2c66d6;color:#fff;font-weight:700}
body.down .snaprow{opacity:.5;pointer-events:none}

/* ---------- adjective search (highlight knobs, no writes) ---------- */
.adjrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:9px 20px;
  border-bottom:1px solid var(--edge);background:rgba(16,22,38,.3)}
.adjrow .cap{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#adjsearch{flex:1 1 260px;min-width:160px;max-width:380px;background:#0f1218;color:var(--ink);
  border:1px solid var(--edge2);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px}
#adjsearch:focus{outline:none;border-color:#5f84d6;box-shadow:0 0 0 2px rgba(61,107,255,.25)}
#adjsearch::placeholder{color:var(--faint)}
.adjhint{font-size:11px;color:var(--faint)}
body.seeking .adjhint{color:#9fb4ff}
.adjlegend{display:none;gap:12px;font-size:11px;font-weight:800;letter-spacing:.02em}
body.seeking .adjlegend{display:inline-flex}
.lg-up{color:var(--up)}
.lg-down{color:var(--down)}
/* while an adjective is chosen: matching knobs in ACTIVE blocks glow, the rest recede.
   green = turn up for more of the quality (↑), pink = turn down for more (↓); the
   ↑/↓ arrow carries the same cue so the colour is never the only signal. */
.hl-off{opacity:.2;filter:grayscale(.7)}
.hl-on{position:relative}
.hl-on::after{content:attr(data-hldir);position:absolute;top:-7px;right:0;font-size:12px;font-weight:800;
  color:var(--wire);text-shadow:0 0 7px var(--wire-glow)}
.hl-on .arc{stroke:var(--wire)!important;filter:drop-shadow(0 0 6px var(--wire-glow))}
.hl-on .sw.on{background:var(--wire)}
.hl-up::after{color:var(--up);text-shadow:0 0 7px var(--up-glow)}
.hl-up .arc{stroke:var(--up)!important;filter:drop-shadow(0 0 6px var(--up-glow))}
.hl-up .sw.on{background:var(--up)}
.hl-down::after{color:var(--down);text-shadow:0 0 7px var(--down-glow)}
.hl-down .arc{stroke:var(--down)!important;filter:drop-shadow(0 0 6px var(--down-glow))}
.hl-down .sw.on{background:var(--down)}
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,10,.62);backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--edge2);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:520px;width:calc(100% - 32px);
  max-height:calc(100% - 64px);display:flex;flex-direction:column;overflow:hidden}
.modal h2{margin:0;padding:16px 20px;font-size:15px;border-bottom:1px solid var(--edge)}
.modal .body{padding:8px 20px 16px;overflow:auto}
.modal .foot-row{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--edge)}
.modal p{color:var(--dim);font-size:13px;line-height:1.5}
.grp{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:#9fb4ff;margin:16px 0 6px}
.grp:first-child{margin-top:4px}
.pz{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--edge2);
  border-radius:9px;padding:9px 12px;margin:4px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz:hover{border-color:#5a6680}
.pz.on{border-color:#2c66d6;color:#cfe0ff}
.pz.on::after{content:" · loaded";color:var(--faint);font-size:11px}

/* ---------- rig ---------- */
main{max-width:1040px;margin:0 auto;padding:22px 20px}
.path{margin-bottom:44px}
.path-hd{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.path-hd b{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9fb4ff}
.path-hd i{flex:1;height:1px;background:linear-gradient(90deg,var(--edge2),transparent)}
.col{display:flex;flex-direction:column;min-width:0}
.wire{align-self:center;width:4px;height:var(--wireh);border-radius:2px;flex:none;
  background:linear-gradient(var(--wire),var(--wire));box-shadow:0 0 10px var(--wire-glow);position:relative}
.wire::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  border:6px solid transparent;border-top:8px solid var(--wire);border-bottom:0}
.fill{align-self:center;width:4px;flex:1;min-height:var(--wireh);border-radius:2px;
  background:var(--wire);box-shadow:0 0 10px var(--wire-glow)}
.empty-lane{align-self:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);padding:2px 0}

/* fork / merge connectors: one centre line opening to (or closing from) two lanes */
.fork,.merge{position:relative;height:calc(var(--wireh) + 8px);flex:none}
.fork i,.merge i{position:absolute;background:var(--wire);box-shadow:0 0 10px var(--wire-glow);border-radius:2px}
.fork .c,.merge .c{left:calc(50% - 2px);width:4px;height:50%}
.fork .c{top:0} .merge .c{bottom:0}
.fork .h,.merge .h{left:calc((100% - var(--gap))/4);right:calc((100% - var(--gap))/4);height:4px;top:calc(50% - 2px)}
.fork .l,.fork .r,.merge .l,.merge .r{width:4px;height:50%}
.fork .l,.merge .l{left:calc((100% - var(--gap))/4 - 2px)}
.fork .r,.merge .r{right:calc((100% - var(--gap))/4 - 2px)}
.fork .l,.fork .r{bottom:0} .merge .l,.merge .r{top:0}
.lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.lane{position:relative;border:1px dashed #2c3a5e;border-radius:16px;padding:26px 10px 0;background:rgba(20,28,48,.35)}
.lane.end{padding-bottom:12px}
.lane::before{content:"";position:absolute;top:-1px;left:calc(50% - 2px);width:4px;height:27px;
  background:var(--wire);box-shadow:0 0 10px var(--wire-glow)}
.lane-tag{position:absolute;top:6px;left:12px;font-size:10px;font-weight:800;letter-spacing:.2em;color:#7f9bff}
.lane.b .lane-tag{color:#ffb37a}

/* ---------- block ---------- */
.blk{--acc:#7c8aa8;position:relative;user-select:none;-webkit-user-select:none;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--edge);border-radius:14px;padding:12px 14px 14px 20px;
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--acc);
  box-shadow:0 0 16px var(--acc)}
.blk.off{filter:saturate(.25);opacity:.5}
.blk.off::before{box-shadow:none;opacity:.4}
.blk.node{align-self:center;min-width:min(420px,100%);border-style:dashed;border-color:#3a4a78;background:#121827}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl{font-size:10px;font-weight:700;letter-spacing:.08em;color:#ffd58a;border:1px solid #6d5522;
  background:#2a2110;border-radius:999px;padding:2px 8px;white-space:nowrap}
.foot{flex:none;display:flex;align-items:center;gap:7px;background:#0f1218;border:1px solid var(--edge2);
  border-radius:999px;padding:4px 11px 4px 7px;cursor:pointer;font-size:10px;font-weight:800;letter-spacing:.12em}
.foot .dot{width:12px;height:12px;border-radius:50%;background:#3a2020;border:1px solid #000}
.foot.on .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.foot.on{color:#bff5da;border-color:#256b4b}
.foot:not(.on){color:var(--dim)}
.ctl{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-start}
.more{margin-top:10px;background:none;border:0;padding:0;color:var(--faint);cursor:pointer;font-size:11px;letter-spacing:.06em}
.more:hover{color:var(--dim)}
.ctl.internal{margin-top:10px;padding-top:10px;border-top:1px dashed var(--edge)}
.ctl.internal[hidden]{display:none}

/* ---------- controls ---------- */
.k{width:78px;text-align:center;position:relative;border-radius:10px;outline:none}
.k svg{display:block;margin:0 auto;cursor:ns-resize;touch-action:none}
.k:focus-visible{box-shadow:0 0 0 2px #5b8cff}
.k .track{fill:none;stroke:#272d3a;stroke-width:6;stroke-linecap:round}
.k .arc{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--acc))}
.k .cap{fill:#232937;stroke:#0c0e13;stroke-width:1.5}
.k .ptr{stroke:#f4f6fb;stroke-width:2.5;stroke-linecap:round}
.k.drag .cap{fill:#2c3446}
.val{font-size:12px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lab{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .sn{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7f9bff;margin-right:4px;vertical-align:1px}
.t{width:78px;display:flex;flex-direction:column;align-items:center;padding-top:9px}
.sw{width:46px;height:24px;border-radius:999px;background:#2b313f;border:1px solid #0c0e13;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#aab2c5;transition:left .1s}
.sw.on{background:var(--acc)} .sw.on::after{left:24px;background:#fff}
.t .val{margin-top:11px}
.s{min-width:132px;max-width:190px;padding-top:6px}
.s select{width:100%;background:#0f1218;color:var(--ink);border:1px solid var(--edge2);border-radius:8px;padding:6px 8px;font:inherit;font-size:12px}
.s .lab{margin-top:6px;text-align:left}
.flash{animation:flash .7s}
@keyframes flash{0%{background:rgba(127,155,255,.35)}100%{background:transparent}}
.err{animation:err .9s}
@keyframes err{0%,60%{background:rgba(255,93,93,.4)}100%{background:transparent}}
body.down main{opacity:.55}

/* ---------- category accents ---------- */
.c-amp,.c-preamp{--acc:#ffb347}.c-distortion{--acc:#ff7a45}.c-dynamics{--acc:#f2d44b}
.c-delay{--acc:#5fd38d}.c-reverb{--acc:#4fc3f7}.c-modulation{--acc:#b388ff}
.c-wah,.c-filter,.c-pitch{--acc:#ff7eb6}.c-eq{--acc:#c5e86c}.c-ir,.c-cab,.c-cab_ir_interp{--acc:#c9a27a}
.c-input,.c-output{--acc:#8fa3c8}.c-split,.c-join{--acc:#5b8cff}.c-volume,.c-send,.c-looper{--acc:#9aa6bd}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{background:#2a1215;border:1px solid #6b2229;color:#ffd7d7;border-radius:10px;padding:9px 13px;max-width:440px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px}
.toast.ok{background:#11261c;border-color:#256b4b;color:#c8f5de}
.hint{color:var(--faint);font-size:11px;text-align:center;margin-top:30px}
</style>
</head>
<body>
<header class="top">
  <span class="led" id="led" title="device connection"></span>
  <div class="who"><span class="preset" id="preset">Connecting…</span><span class="sub">Helix Live — every tweak writes to the device</span></div>
  <span class="chip snap" id="snap" hidden></span>
  <span class="chip dirty" title="the tone has changes that are not saved on the device">Unsaved</span>
  <button class="btn" id="undo" title="Undo (Ctrl/Cmd+Z)" disabled>Undo</button>
  <button class="btn" id="redo" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>Redo</button>
  <button class="btn" id="load" title="Load a different preset from the device">Load…</button>
  <button class="btn" id="reread" title="Read the whole tone from the device again">Re-read</button>
  <button class="btn save" id="save" title="Save the tone on the device (same as Save on the hardware)">Save</button>
</header>
<p class="banner" id="banner">Device disconnected — retrying. Controls are paused.</p>
<div class="snaprow" id="snaprow"></div>
<div class="adjrow">
  <span class="cap">Find knobs for</span>
  <input id="adjsearch" list="adjlist" autocomplete="off" spellcheck="false"
    placeholder="a quality… crunchier, brighter, droney" aria-label="Highlight the knobs that affect a tone quality">
  <datalist id="adjlist"></datalist>
  <span class="adjhint" id="adjhint"></span>
  <span class="adjlegend"><b class="lg-up">↑ turn up for more</b><b class="lg-down">↓ turn down for more</b></span>
</div>
<main id="rig"></main>
<div id="toasts"></div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const ME = Math.random().toString(36).slice(2) + Date.now().toString(36);
const $ = (id) => document.getElementById(id);
let S = null;                     // last full state from the server
const P = new Map();              // "path/block/pid" -> control {p, b, tag, dev, set, fail}
const B = new Map();              // "path/block"     -> control {b, tag, dev, set, fail}
let dragging = null;              // key of the knob under the user's hand
let down = true;                  // device (or server) unreachable: nothing is writable
let undoS = [], redoS = [];
const openInternal = new Set();   // blocks whose "internal" row the user expanded

const el = (tag, cls, text) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const sv = (tag, attrs) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const blip = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

function toast(msg, ok) {
  const t = el("div", "toast" + (ok ? " ok" : ""), msg);
  $("toasts").append(t); setTimeout(() => t.remove(), ok ? 2200 : 5200);
}

/* ---------- value <-> display ---------- */
const span = (p) => (p.max - p.min) || 1;
function shown(p, v) {            // raw -> the number the hardware shows
  if (p.display_min != null && p.display_max != null)
    return p.display_min + (v - p.min) / span(p) * (p.display_max - p.display_min);
  return v * (p.scale || 1);
}
function fmt(p, v) {
  if (p.labels && p.type !== "f") {
    const lab = p.labels[Math.round(v - p.min)];
    if (lab != null) return lab;
  }
  let x = shown(p, v);
  const u = p.unit || "";
  if (p.type === "i" || p.type === "b") return (Math.round(x) || 0) + (u ? " " + u : "");
  if (u === "Hz" && Math.abs(x) >= 1000) return (x / 1000).toFixed(2) + " kHz";
  const w = Math.abs(shown(p, p.max) - shown(p, p.min));
  const d = w >= 100 ? 0 : w >= 5 ? 1 : 2;
  if (Math.abs(x) < 0.5 / Math.pow(10, d)) x = 0;       // never "-0.0"
  return x.toFixed(d) + (u ? " " + u : "");
}
// clamp only; ints snap. Floats are NOT rounded: the device's float32 values
// must compare equal to themselves or every click would look like a change.
const clampV = (p, v) => {
  v = Math.max(p.min, Math.min(p.max, v));
  return (p.type === "i" || p.type === "b") ? Math.round(v) : v;
};

/* ---------- writes: one in flight, only the newest value per control ---------- */
let inflight = false;
const pending = new Map();
let idleWaiters = [];
function queue(kind, key) { if (down) return; pending.set(kind + ":" + key, { kind, key }); pump(); }
function drained() {              // resolves once nothing is queued or in flight
  return (!inflight && !pending.size) ? Promise.resolve() : new Promise((r) => idleWaiters.push(r));
}
async function pump() {
  if (inflight) return;
  const it = pending.entries().next();
  if (it.done) { const w = idleWaiters; idleWaiters = []; w.forEach((r) => r()); return; }
  const [qk, job] = it.value; pending.delete(qk); inflight = true;
  const map = job.kind === "param" ? P : B;
  const c = map.get(job.key);
  try {
    if (c) {
      const body = job.kind === "param"
        ? { path: c.b.path, block: c.b.block, pid: c.p.pid, value: c.p.value }
        : { path: c.b.path, block: c.b.block, enabled: c.b.enabled };
      body.client = ME; body.rev = S.rev;
      // look the control up AGAIN in the callbacks: a re-render while the
      // request was out replaces every control object
      await send(job.kind === "param" ? "/param" : "/bypass", body,
        (j) => { const n = map.get(job.key); if (!n) return;
          const v = job.kind === "param" ? j.value : j.enabled;
          if (v == null) return;
          n.dev = v;
          if (dragging !== job.key && !pending.has(qk)) n.set(v); },
        (j) => { const n = map.get(job.key);
          dropHist(job.kind, job.key);            // the change never happened
          if (n) n.fail(j ? j.value : undefined); });
    }
  } finally { inflight = false; pump(); }
}
async function send(url, body, ok, bad) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 6000);   // a hung request must not jam the queue
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body), signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (r.ok) ok(j); else { bad(j); toast(j.error || ("request failed (" + r.status + ")")); }
  } catch (e) { bad(null); toast("the editor server did not answer"); }
  finally { clearTimeout(timer); }
}

/* ---------- undo / redo (one entry per committed change) ---------- */
function record(kind, key, before, after, how) {
  if (before === after) return;
  const c = (kind === "param" ? P : B).get(key);
  const top = undoS[undoS.length - 1], now = Date.now();
  // key auto-repeat / a burst of nudges on one control is ONE step
  if (how === "key" && top && top.how === "key" && top.kind === kind && top.key === key && now - top.at < 900) {
    top.after = after; top.at = now;
    if (top.before === top.after) undoS.pop();
  } else undoS.push({ kind, key, before, after, how, at: now, tag: c ? c.tag : null });
  redoS = []; syncHist();
}

/* ---------- controls ---------- */

/* ---------- blocks + chain ---------- */
const STRUCT = new Set(["split", "join"]);
const NO_BYPASS = new Set(["split", "join", "input", "output"]);
function blockEl(b) {
  const root = el("section", "blk c-" + String(b.category || "x").replace(/[^a-z0-9_]/gi, "") +

  const key = b.path + "/" + b.block; root.dataset.b = key;

  hd.lastChild.title = b.model;

      f.setAttribute("aria-pressed", b.enabled); root.classList.toggle("off", !b.enabled); };

      fail(v) { b.enabled = (v != null) ? !!v : c.dev; if (v != null) c.dev = !!v; paint(); applyHighlight(); blip(hd, "err"); } };

  if (extra.length) {

const wire = () => el("div", "wire");

  l.append(el("span", "lane-tag", "LANE " + tag));
  if (!segs.length) l.append(el("div", "empty-lane", joined ? "straight through" : "no blocks"));
  segs.forEach((s, i) => { if (i) l.append(wire()); l.append(segEl(s)); });

}

  w.append(blockEl(seg.split), conn("fork"));
  const lanes = el("div", "lanes");

}

}
function renderSnaps() {

  row.append(el("span", "cap", "Snapshot"));
  names.forEach((nm, i) => {
    const b = el("button", "snap-btn" + (i === S.snapshot ? " on" : ""),
      (i + 1) + (nm ? " · " + nm : ""));
    b.type = "button";
    b.onclick = () => { if (down || i === S.snapshot) return;

function render() {
  renderSnaps();

    if (pt.extra.length) {

  if (fkey) {                     // a re-render must not throw the keyboard user out

/* ---------- adjective search: point at the knobs, never turn them ---------- */
// category (block.category) -> intent role. Mirror of liveedit/intents.py
// `_CATEGORY_ROLE` (+ the dynamics gate/comp split). Keep the two in step.
const CAT_ROLE = { amp: "amp", preamp: "amp", distortion: "drive_pedal",
  cab_ir_interp: "cab", ir: "cab", delay: "delay", reverb: "reverb", modulation: "modulation" };

  return CAT_ROLE[b.category] || null;
}

let intentsReq = false;
let activeIntent = null;          // the chosen intent object, or null
function resolveIntent(text) {    // exact match on a label or alias (what the datalist commits)
  const q = (text || "").trim().toLowerCase();
  if (!q || !INTENTS) return null;

    i.label.toLowerCase() === q || i.aliases.some((a) => a.toLowerCase() === q)) || null;
}

    const role = activeIntent && c.b.enabled && roleOf(c.b);   // bypassed blocks never light
    const mv = role && activeIntent.moves.find((m) => m.role === role && m.param === c.p.name);
    c.root.classList.toggle("hl-on", !!mv);
    c.root.classList.toggle("hl-up", !!mv && mv.dir > 0);
    c.root.classList.toggle("hl-down", !!mv && mv.dir < 0);
    c.root.classList.toggle("hl-off", !!activeIntent && !mv);

}
function fillDatalist(terms) {
  const dl = $("adjlist"); if (!dl) return;
  dl.textContent = "";

}
function ensureIntents() {        // fetched lazily on first use, so it never races the chain load

}

}
$("adjsearch").addEventListener("focus", ensureIntents);
$("adjsearch").addEventListener("input", onAdjInput);
function setDown(isDown, why) {

  if (why) $("banner").textContent = why;

}
function meta(m) {

  $("preset").textContent = (m.preset && m.preset.name) || "Edit buffer";
  const sn = $("snap");
  if (m.snapshot == null) sn.hidden = true;
  else { sn.hidden = false; sn.textContent = "Snapshot " + (m.snapshot + 1) + (m.snapshot_name ? " · " + m.snapshot_name : ""); }
  document.title = ((m.preset && m.preset.name) ? m.preset.name + " — " : "") + "Helix Live";

/* ---------- the event stream ---------- */
// what the controls ARE (not their values): a model swap in place changes it
const shape = (s) => JSON.stringify(s.paths.map(function walk(x) {
  if (Array.isArray(x)) return x.map(walk);
  if (x.segments) return [x.path, walk(x.segments), walk(x.extra)];
  if (x.kind === "block") return [x.block.block, x.block.model];
  return [x.split.block, x.split.model, walk(x.a), walk(x.b), x.join && [x.join.block, x.join.model]];
}));
function onMsg(m) {
  if (m.t === "state") {

    const same = S && S.preset && m.preset && S.preset.cid != null && S.preset.cid === m.preset.cid &&
      S.snapshot === m.snapshot && shape(S) === shape(m);

    const c = (isP ? P : B).get(key);

function connect() {
  const es = new EventSource("/events");
  es.onmessage = (e) => { try { onMsg(JSON.parse(e.data)); } catch (x) { console.error(x); } };
  es.onerror = () => {
    setDown(true, "Lost contact with the editor server — is `helixgen device live` still running?");
    if (es.readyState === 2) { es.close(); setTimeout(connect, 3000); }   // the browser gave up: try again ourselves
  };

/* ---------- preset picker + unsaved-work guard ---------- */
let overlay = null;
function closeOverlay() { if (overlay) { overlay.remove(); overlay = null; } }
function modal(title) {
  closeOverlay();

  const m = el("div", "modal"), body = el("div", "body"), foot = el("div", "foot-row");
  m.append(el("h2", null, title), body, foot);
  overlay.append(m);
  overlay.onclick = (e) => { if (e.target === overlay) closeOverlay(); };   // backdrop dismiss

}
function footBtn(foot, text, cls, fn) {
  const b = el("button", "btn" + (cls ? " " + cls : ""), text);

}

}

  footBtn(foot, "Cancel", "", closeOverlay);
  footBtn(foot, "Discard & load", "", () => loadPreset(cid));
  footBtn(foot, "Save, then load", "save", async () => {
    await drained();                                   // the last tweak must land before Save
    send("/save", {}, () => loadPreset(cid),           // load only if the Save took
      () => {});                                       // Save refused (e.g. a factory preset): keep the buffer, send() says why
  });
}
function pick(cid, name) {

}
async function openPicker() {

  if (!r || r.error || !r.groups) { body.append(el("p", null, "Could not list the device's presets.")); return; }

      b.type = "button"; b.onclick = () => pick(p.cid, p.name);
      body.append(b);
    });

}
addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeOverlay(); });
$("load").onclick = openPicker;
$("undo").onclick = undo; $("redo").onclick = redo;
$("reread").onclick = () => send("/reread", {}, () => toast("Re-read from the device", true), () => {});
$("save").onclick = async () => {
  await drained();                // the last tweak must be on the device before it is saved
  send("/save", {}, (j) => toast("Saved “" + (j.saved || "preset") + "” on the device", true), () => {});
};
setDown(true, "Connecting…");
connect();
